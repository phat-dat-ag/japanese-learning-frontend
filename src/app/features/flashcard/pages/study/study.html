<div class="mx-auto max-w-5xl px-6 py-8">
    <div class="flex items-center justify-between">
        <div>
            <a [routerLink]="['/flashcards', levelId]" class="text-sm font-medium text-gray-500 hover:text-indigo-600">
                ← Back to lessons
            </a>

            @if (lesson) {
            <p class="mt-3 text-sm text-gray-500">
                {{ level?.code }} / Lesson {{ lesson.lessonNumber }}
            </p>

            <h1 class="mt-1 text-xl font-bold text-gray-900">
                {{ lesson.title }}
            </h1>
            }
        </div>

        <div class="text-sm font-medium text-gray-600">
            {{ currentIndex() + 1 }} / {{ cards.length }}
        </div>
    </div>

    <div class="mt-6 h-2 overflow-hidden rounded-full bg-gray-100">
        <div class="h-full rounded-full bg-indigo-600 transition-all" [style.width.%]="progress()"></div>
    </div>

    @if (currentCard(); as card) {
    <div class="mt-10 flex justify-center">
        <app-flashcard [card]="card" />
    </div>

    <div class="mt-8 flex justify-center">
        <button type="button"
            class="rounded-lg bg-indigo-600 px-6 py-3 font-medium text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="currentIndex() >= cards.length - 1" (click)="nextCard()">
            Next card
        </button>
    </div>
    } @else {
    <div class="mt-12 rounded-xl border border-dashed border-gray-300 p-12 text-center">
        <p class="text-gray-500">
            No flashcards available for this lesson.
        </p>
    </div>
    }
</div>
