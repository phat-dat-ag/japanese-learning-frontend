<header class="h-16 border-b bg-white">
    <div class="flex h-full items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <button type="button" class="rounded-lg p-2 text-gray-600 hover:bg-gray-100" aria-label="Toggle sidebar"
                (click)="toggleSidebarFromHeader.emit()">
                ☰
            </button>

            <a routerLink="/" class="text-xl font-bold text-indigo-600">
                Japanese Learning
            </a>
        </div>

        <div class="flex items-center gap-4">
            <span class="text-sm text-gray-600">
                Welcome!
            </span>

            <button type="button" class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
                (click)="navigateToProfile()">
                Profile
            </button>
        </div>
    </div>
</header>
