<header class="sticky top-0 z-40 h-16 border-b border-gray-200/80 bg-white/95 backdrop-blur">
    <div class="flex h-full items-center justify-between px-4 sm:px-6">
        <div class="flex items-center gap-3">
            <button type="button" class="group flex h-10 w-10 items-center justify-center rounded-xl
                       text-gray-500 transition-all duration-200
                       hover:bg-indigo-50 hover:text-indigo-600
                       active:scale-95" aria-label="Toggle sidebar" (click)="toggleSidebarFromHeader.emit()">
                <svg class="h-5 w-5 transition-transform duration-200 group-hover:scale-110" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <a routerLink="/" class="group flex items-center gap-2">
                <div class="flex h-9 w-9 items-center justify-center rounded-xl
                           bg-gradient-to-br from-indigo-500 to-violet-600
                           text-sm font-bold text-white shadow-md
                           shadow-indigo-200
                           transition-transform duration-200
                           group-hover:scale-105">
                    日
                </div>

                <div class="hidden sm:block">
                    <div class="text-base font-bold leading-tight text-gray-900">
                        Japanese Learning
                    </div>

                    <div class="text-[11px] font-medium text-indigo-500">
                        Learn • Practice • Master
                    </div>
                </div>
            </a>
        </div>

        <div class="flex items-center gap-2 sm:gap-4">
            <div class="hidden items-center gap-2 rounded-xl bg-orange-50 px-3 py-2
                       text-orange-600 sm:flex">
                <span class="text-base">🔥</span>

                <div class="text-xs">
                    <div class="font-bold">7 days</div>
                    <div class="text-orange-500">streak</div>
                </div>
            </div>

            <div class="hidden text-right md:block">
                <p class="text-xs text-gray-400">
                    Welcome back
                </p>

                <p class="text-sm font-semibold text-gray-700">
                    Japanese Learner
                </p>
            </div>

            <button type="button" class="flex items-center gap-2 rounded-xl border border-gray-200
                       bg-white px-2 py-1.5 transition-all duration-200
                       hover:border-indigo-200 hover:bg-indigo-50
                       hover:shadow-sm active:scale-95" (click)="navigateToProfile()">
                <div class="flex h-8 w-8 items-center justify-center rounded-lg
                           bg-gradient-to-br from-indigo-500 to-violet-600
                           text-xs font-bold text-white">
                    JL
                </div>

                <svg class="hidden h-4 w-4 text-gray-400 sm:block" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6" />
                </svg>
            </button>
        </div>
    </div>
</header>
